# DJspectrum — Home Assistant Automations for ESPHome Spectrum Analyzer
# These use the native ESPHome API entities (no MQTT needed)

# ── Daytime: show clock at 07:00, brightness 180 ──
- id: djspectrum_daytime_clock
  alias: "DJspectrum Daytime Clock"
  trigger:
    - platform: time
      at: "07:00:00"
  action:
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "clock"
    - service: number.set_value
      target:
        entity_id: number.spectrum_analyzer_brightness
      data:
        value: 180
    - service: switch.turn_on
      target:
        entity_id: switch.spectrum_analyzer_show_date

# ── Evening: switch to spectrum mode ──
- id: djspectrum_evening_spectrum
  alias: "DJspectrum Evening Spectrum"
  trigger:
    - platform: time
      at: "18:00:00"
  action:
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "spectrum"
    - service: number.set_value
      target:
        entity_id: number.spectrum_analyzer_brightness
      data:
        value: 96

# ── Night dim at 22:00 ──
- id: djspectrum_night_dim
  alias: "DJspectrum Night Dim"
  trigger:
    - platform: time
      at: "22:00:00"
  action:
    - service: number.set_value
      target:
        entity_id: number.spectrum_analyzer_brightness
      data:
        value: 30

# ── Bedtime off at 23:30 ──
- id: djspectrum_bedtime_off
  alias: "DJspectrum Bedtime Off"
  trigger:
    - platform: time
      at: "23:30:00"
  action:
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "off"

# ── Door open alert ──
- id: djspectrum_door_alert
  alias: "DJspectrum Door Alert"
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door
      to: "on"
  action:
    - service: text.set_value
      target:
        entity_id: text.spectrum_analyzer_alert_text
      data:
        value: "DOOR OPEN!"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "alert"
    - delay: "00:00:30"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "spectrum"

# ── Show sensors every 5 minutes during daytime ──
- id: djspectrum_show_sensors
  alias: "DJspectrum Show Sensors"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: time
      after: "07:00:00"
      before: "22:00:00"
    - condition: state
      entity_id: select.spectrum_analyzer_display_mode
      state: "clock"
  action:
    - service: text.set_value
      target:
        entity_id: text.spectrum_analyzer_sensor_1_label
      data:
        value: "Temp"
    - service: text.set_value
      target:
        entity_id: text.spectrum_analyzer_sensor_1_value
      data:
        value: "{{ states('sensor.indoor_temperature') }}C"
    - service: text.set_value
      target:
        entity_id: text.spectrum_analyzer_sensor_2_label
      data:
        value: "Humidity"
    - service: text.set_value
      target:
        entity_id: text.spectrum_analyzer_sensor_2_value
      data:
        value: "{{ states('sensor.indoor_humidity') }}%"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "sensors"
    - delay: "00:00:30"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "clock"

# ── Scroll notification (fire event djspectrum_notify) ──
- id: djspectrum_scroll_notification
  alias: "DJspectrum Scroll Notification"
  trigger:
    - platform: event
      event_type: djspectrum_notify
  action:
    - service: text.set_value
      target:
        entity_id: text.spectrum_analyzer_display_text
      data:
        value: "{{ trigger.event.data.message }}"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "scroll"
    - delay:
        seconds: "{{ trigger.event.data.get('duration', 20) }}"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "spectrum"

# ── Welcome home ──
- id: djspectrum_welcome_home
  alias: "DJspectrum Welcome Home"
  trigger:
    - platform: state
      entity_id: person.garry
      to: "home"
  action:
    - service: text.set_value
      target:
        entity_id: text.spectrum_analyzer_display_text
      data:
        value: "Welcome Home!"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "text"
    - delay: "00:00:15"
    - service: select.select_option
      target:
        entity_id: select.spectrum_analyzer_display_mode
      data:
        option: "spectrum"
